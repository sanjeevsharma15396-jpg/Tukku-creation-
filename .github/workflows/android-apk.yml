
name: Build TUKKU-CREATION Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android Preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Install Expo required packages
        working-directory: mobile
        run: npx expo install expo-asset expo-constants

      - name: Set Expo project owner
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo = config.expo || {};
          config.expo.owner = 'sanjeev1996';
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Verify Expo authentication
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest whoami

      - name: Build Android APK via EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        
